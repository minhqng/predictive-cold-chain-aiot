# ColdGuard W10 feature registry v1 (B-W10-01).
#
# The registry freezes FEATURE SCHEMA AND CAUSAL DEFINITIONS only. Physical
# thresholds, the final representative temperature, the primary horizon,
# operating thresholds, warning persistence and matching tolerances remain
# controlled by their own freeze authorities and are NOT frozen here.
#
# Every listed feature is computed from information observed at or before the
# prediction anchor. The registry file is the version identity: its canonical
# SHA-256 is recorded on every generated feature row and artifact.
schema: coldguard-feature-registry-v1
feature_version: CG-FEAT-1.0
registry_status: FROZEN_DEFINITIONS
frozen_scope:
  - feature_names
  - formulas
  - source_roles
  - input_quality_requirements
  - lookback_semantics
  - missingness_behavior
  - feature_order
  - feature_schema_hash
not_frozen_here:
  - T_critical_c
  - representative_temperature_for_final_labels
  - primary_horizon_H
  - operating_threshold
  - warning_persistence
  - matching_tolerances
  - physical_completeness_thresholds
policy:
  window_convention: "(t - lookback_s, t]"
  minimum_history_rule: "earliest included sample must satisfy t - time >= minimum_history_s; coverage is measured on actual event time, never on sample count"
  max_gap_s: 5.0
  duplicate_policy: "collapse identical canonical payloads per sample identity; refuse contradictory payloads (input order never decides)"
  missing_data_policy: explicit_missing_never_zero_filled
  time_domain_policy: source_declared_never_inferred_from_receive_time
  boot_boundary_policy: no_rolling_or_door_continuity_across_boot
  fit_policy: no_cross_partition_fit_no_normalization
  electrical_qualification: "only VALID electrical samples produce electrical features; UNKNOWN/INVALID/DEGRADED stay missing"
  door_trust_rule: "trusted only when state is OPEN or CLOSED, door quality is VALID and polarity is attested"
role_map:
  observed_rig:
    source: "A operator as-built role record as analysed in evidence/A/W07/repeatability-tmean_airroles_v0.json; a role record, not independently measured calibration"
    slots:
      t1:
        physical_position: CHAMBER_CENTER
        in_chamber_air_aggregate: true
      t2:
        physical_position: TEC_HOT_SIDE
        in_chamber_air_aggregate: false
      t3:
        physical_position: CHAMBER_BOTTOM
        in_chamber_air_aggregate: true
      t4:
        physical_position: CHAMBER_NEAR_DOOR
        in_chamber_air_aggregate: true
  chamber_air_roles:
    - CHAMBER_CENTER
    - CHAMBER_BOTTOM
    - CHAMBER_NEAR_DOOR
  hot_side_roles:
    - TEC_HOT_SIDE

