    unit: degC
    family: instantaneous_thermal
    physical_meaning: "Hottest role-qualified chamber-air probe at the anchor."
    source_fields: [t1_c, t3_c, t4_c]
    source_schema: "W04 NormalizedRow adapter / W02 Observation adapter"
    sensor_roles: [CHAMBER_CENTER, CHAMBER_BOTTOM, CHAMBER_NEAR_DOOR]
    quality_requirements: "thermal quality VALID; every required role-qualified probe present"
    time_domain: source_declared
    lookback_rule: instantaneous_at_anchor
    lookback_s: 0.0
    minimum_history_s: 0.0
    max_gap_s: null
    missing_data_policy: "missing when any required probe or thermal quality is absent; never a partial maximum"
    first_valid_timestamp_rule: "first anchor where all required chamber-air roles are present and thermal quality is VALID"
    causal_availability_condition: "all probe values observed at or before t"
    aggregation_definition: "max of the three role-qualified chamber-air probes"
    method: instantaneous_aggregate
    method_params: {statistic: max}
    provenance: "registry CG-FEAT-1.0; role map observed_rig"
    freeze_status: FROZEN_DEFINITION
    intended_use: model_input_candidate
