schema: coldguard-xgb-v1-config-v1
config_version: coldguard-xgb-v1-development-v1
status: DEVELOPMENT_CANDIDATE_NOT_SCIENTIFICALLY_SELECTED
provenance: SYNTHETIC_SOFTWARE_CONTROL_ONLY
model_family: XGBoost
objective: binary:logistic
tree_method: hist
max_depth: 3
learning_rate: 0.05
n_estimators: 60
subsample: 1.0
colsample_bytree: 1.0
reg_lambda: 1.0
reg_alpha: 0.0
random_state: 42
n_jobs: 1
risk_threshold: 0.5
score_semantics: risk_score
calibration_status: NOT_PERFORMED
primary_metric: AVERAGE_PRECISION

feature_policy:
  allowlist:
    - T_chamber_max_c
    - T_chamber_min_c
    - T_chamber_mean_c
    - T_chamber_spread_c
    - T_center_c
    - T_bottom_c
    - T_near_door_c
    - rolling_mean_temperature_60s
    - rolling_std_temperature_60s
    - rolling_min_temperature_60s
    - rolling_max_temperature_60s
    - past_only_slope_c_per_min_60s
    - past_only_temperature_delta_60s
    - past_only_spatial_spread_60s
    - door_open
    - time_since_open
    - duration_so_far
    - count_past_60s
    - applied_cooling
    - applied_duty
    - time_since_confirmed_applied_change
    - cooling_voltage_v
    - cooling_current_a
    - cooling_power_w
    - energy_counter_wh
    - past_integrated_cooling_energy_wh
    - ambient_temperature_c
    - relative_humidity_pct
  excluded_diagnostic_features:
    - T_tec_hot_side_c
  prohibited_fields:
    - run_id
    - pair_id
    - source_sha256
    - boot_id
    - physical_source_key
    - scenario_id
    - controller_id
    - critical_event_time_s
    - critical_event
    - future_horizon_label
    - label
    - y
    - post_intervention_outcome
    - source_filename
    - split_partition
    - partition
    - warning_episode
    - test_run

label:
  spec_version: coldguard-w11-development-label-v1
  horizon_s: 60.0
  representative_temperature: DEVELOPMENT_CANDIDATE_NOT_SELECTED
  boundary_c: null
  frozen_at: null
  status: DEVELOPMENT_CANDIDATE_NOT_FROZEN

grouped_cv:
  n_splits: 4
  seed: 42
  min_train_groups: 1
  min_validation_groups: 1

imbalance:
  strategies:
    - UNWEIGHTED
    - TRAIN_FOLD_CLASS_WEIGHT
  selection_rule: PREDECLARED_AP_ALL_FOLDS_REPORTED

baseline:
  champion_status: SYNTHETIC_ILLUSTRATIVE_NOT_FROZEN
  warning_threshold: 0.5
  representative:
    name: W11_CHAMBER_AIR_MEAN
    mode: CHAMBER_AIR_MEAN
    slots:
      - t1
      - t3
      - t4
    unit: degC
    source: W11 deterministic synthetic fixture
    freeze_status: SYNTHETIC_ILLUSTRATIVE
  b0:
    threshold_c: 5.5
    operator: GT
    threshold_source: W11 illustrative synthetic threshold, not a physical freeze
    threshold_status: SYNTHETIC_ILLUSTRATIVE
  b1:
    upper_on_c: 5.5
    lower_off_c: 5.2
    initial_state: "OFF"
    initial_state_source: declared synthetic fixture start state
    upper_lower_source: W11 illustrative synthetic hysteresis, not a physical freeze
    freeze_status: SYNTHETIC_ILLUSTRATIVE
  time_domain: BOOT_SCOPED_UPTIME
  max_continuity_gap_s: 10.0
  episode_policy:
    policy_version: coldguard-w11-synthetic-episode-v1
    min_persistence_s: 0.0
    bridge_gap_s: 2.0
    bridge_unknown_gaps: false
    status: SYNTHETIC_ILLUSTRATIVE
    source: W11 shared comparison policy
  association_policy:
    policy_version: coldguard-w11-synthetic-association-v1
    pre_window_s: 60.0
    post_window_s: 30.0
    require_trusted_events: true
    allow_censored_events: false
    status: SYNTHETIC_ILLUSTRATIVE
    source: W11 shared comparison policy

evaluation:
  sample_unit: feature_anchor_window
  event_unit: warning_episode_vs_critical_event
  primary_metric: AVERAGE_PRECISION
  report_undefined_metrics: true
  allow_locked_test_access: false
