      Đầu dò thứ tư đã hiện diện và đọc được. Nó KHÔNG được gán vai trò.
      docs/01 PHY-DS-001 chỉ yêu cầu T1/T2/T3 ánh xạ tới ba ROM phân biệt;
      đầu dò dư phải là biến tường minh, không được tự động thay thế
      cảm biến thiếu (PHY-DS-002).

