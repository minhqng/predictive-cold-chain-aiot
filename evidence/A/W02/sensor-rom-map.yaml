next_actions:
  - Dán nhãn vật lý T1/T2/T3 (và SPARE) lên dây/đầu dò, chụp ảnh nhãn + vị trí.
  - Chạy và lưu log >= 5 chu kỳ reboot/discovery để đóng SEN-H1-02.
  - Lưu `sensor-consistency.csv` (hoặc serial log thô có timestamp) từ lần chạy thật.
  - Ghi `firmware_commit` của sketch bench khi xác định được nguồn.
  - Leader xác nhận lệch số lượng đầu dò (CR-A-W01-04) có được chấp nhận làm cấu hình W02 hay không.
