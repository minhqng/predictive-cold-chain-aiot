# ColdGuard — Member A — W02
# DS18B20 ROM → role map (identity contract, docs/01 §6.4–6.5)
#
# Pin map hiệu lực (2026-10-28): evidence/A/as-built-pinmap-2026-10-27.md
#   DS18B20 DATA = GPIO33, CG_PIN_MAP_VERSION = 2. ROM bytes dưới đây không đổi.
#
# Thẩm quyền: docs/01 §6.4 (sensor roles), §6.5 (identity contract),
#             §6.6 (PHY-DS-001..003), docs/05A §11 (A-W02-02, A-W02-03).
# Nguồn dữ liệu: evidence/A/W02/w02_rom_enumeration_4_devices.png (ảnh gốc,
#                người dùng cung cấp; xem screenshot-provenance.csv).
#
# CẢNH BÁO PHẠM VI CLAIM:
# - Tệp này chỉ khẳng định ROM đã được *quan sát và gán vai trò logic*.
# - Nó KHÔNG khẳng định đầu dò vật lý nào đã được dán nhãn, KHÔNG khẳng định
#   vị trí lắp thật đã freeze, và KHÔNG thay thế H0 mechanical (A-W02-01).
# - ROM được ghi NGUYÊN VĂN đúng chuỗi sketch in ra. Coi ROM là định danh
#   bất trong suốt (opaque); không tự suy diễn thứ tự byte/CRC từ chuỗi này.

schema: coldguard.sensor-rom-map/v0
week: W02
owner: member-a
hardware_config_id: NOT_ASSIGNED        # chưa được gán (kế thừa W01)
firmware_commit: 1b93f572ed3f06a3030292b2515fa38bcaf75ca7 # commit firmware W02 trong repo (map đã ghi cứng; lần cập nhật 7: + fix door-task vTaskDelay(0) ở app_main.c — đã build thật trên CI run 39134178842, flash thật trên board ESP32-S3 và 5 reboot identity PASS — espidf-run/); xem thêm bench_sketch_source
bench_sketch_source: NOT_IN_REPO         # sketch bench sinh ra 3 ảnh: nguồn không nằm trong repo
calibration_id: null
rounds_used: []                          # chưa có run_id nào dùng mapping này

status: ROLE_ASSIGNED_PHYSICAL_LABEL_PENDING

# Trạng thái trên nghĩa là:
#   - Vai trò logic (T1/T2/T3) ĐÃ được Member A chọn và ghi lại;
#   - đầu dò vật lý CHƯA được nhận diện, CHƯA dán nhãn, CHƯA chụp ảnh nhãn;
#   - người vận hành chưa chứng minh được "đầu dò nào là T1" khi nhìn vào thùng.
# Không được nâng trạng thái này thành DONE khi chưa có nhãn vật lý thật.

enumeration:
  evidence: w02_rom_enumeration_4_devices.png
  discovered_count: 4
  valid_count_in_capture: "4/4"
  canonical_expected_count: 3            # docs/05A §11 A-W02-02 "exactly three expected ROMs"
  count_deviation_ref: CR-A-W01-04        # W01: DS18B20 ×4 so với BOM freeze ×3
  library_order_is_not_identity: true     # docs/01 §6.5
  firmware_message_observed: "PASS: 4 DS18B20 detected"

# Bản đồ trên nay đã được GHI CỨNG vào firmware W02 trong repo:
#   firmware/main/coldguard_config.h (CG_ROM_T1/T2/T3/SPARE_BYTES)
#   firmware/main/cg_rom_map.c       (tra cứu theo 8 byte ROM, không theo thứ tự discovery)
# `firmware/tools/cg_check_firmware.py` đối chiếu từng byte với tệp này và tính lại
# CRC8 Dallas của cả 4 ROM ở mỗi lần chạy kiểm tra. Firmware mới này KHÔNG phải nguồn
# của 3 ảnh bằng chứng (sketch bench cũ không có trong repo) — xem
# firmware-implementation.md.
firmware_mapping:
  config_header: firmware/main/coldguard_config.h
  lookup_module: firmware/main/cg_rom_map.c
  cross_check_tool: firmware/tools/cg_check_firmware.py
  crc8_verified: true
  discovery_order_used_for_identity: false

roles:
  - role: T1
    position_semantics: near_door          # docs/01 §6.4
    rom_hex: "287088CA00000051"
    bench_enumeration_index: 1
