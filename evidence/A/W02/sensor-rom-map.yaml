    result: PARTIAL
    reason: >-
      Có bản tổng hợp 600 mẫu/đầu dò trong ảnh summary; thiếu CSV thô và
      timestamp (xem sensor-consistency-summary.md).
  physical_labeling:
    result: NOT_PERFORMED
    reason: >-
      Chưa dán nhãn T1/T2/T3 lên đầu dò. Leader review docs/05A §11 yêu cầu chỉ
      đúng vào T1/T2/T3 và khớp với software ID — chưa thể thực hiện.

