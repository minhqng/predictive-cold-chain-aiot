    statement: "T1, T2, T3 phải ánh xạ tới ba ROM phân biệt."
    current_state: SATISFIED_ON_BENCH     # ba ROM khác nhau; chưa gắn nhãn vật lý
  - id: PHY-DS-002
    statement: "ROM lạ sau reboot không tự động thay thế cảm biến đã biết bị thiếu."
