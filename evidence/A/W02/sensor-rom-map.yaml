      đầu dò dư phải là biến tường minh, không được tự động thay thế
      cảm biến thiếu (PHY-DS-002).

verification_status:
  SEN-H1-01_ds18b20_discovery:
    result: PARTIAL
    reason: >-
      4 ROM phân biệt được liệt kê và đọc giá trị hợp lệ trong cùng phiên bench;
      canonical mong đợi đúng 3 ROM nên lệch số lượng cần ghi nhận bằng văn bản
      (CR-A-W01-04). Ba ROM vai trò đã được ghi cứng vào firmware và đối chiếu tự
      động với tệp này.
  SEN-H1-02_reboot_identity:
    result: HARDWARE_VERIFIED
    reason: >-
      Firmware ESP-IDF 1b93f572 đã nạp và chạy thật trên board: 6 boot (5 reset
      host-driven + 1 context), boot_id phân biệt, NVS boot_count 5->10 tăng liên
      tục, ROM->role ổn định 6/6 gồm cả SPARE (espidf-run/reboot-verification.md).
    evidence_state: VERIFIED_BY_EXISTING_EVIDENCE
  SEN-H1-03_inter_sensor_consistency:
    result: BENCH_DATA_VERIFIED_FIRMWARE_RUN_PENDING
    reason: >-
      Phiên bench 620 mẫu thật (ds18b20/) đã nhập: 620/620 mẫu x 4 vai trò, 619 s
      đều 1000 ms, thống kê tái lập từ log. Đây là sketch Arduino standalone; CSV
      theo schema #CG SAMPLE của firmware (cg_build_sensor_csv.py) vẫn cần phiên
      >=600 mẫu chạy bằng firmware. Bản tổng hợp 600 mẫu/đầu dò trong ảnh cũ vẫn
      thiếu CSV thô và timestamp (sensor-consistency-summary.md).
    raw_csv_state: FIRMWARE_RUN_PENDING
  physical_labeling:
    result: NOT_PERFORMED
    reason: >-
      Chưa dán nhãn T1/T2/T3 lên đầu dò. docs/05A §11 yêu cầu chỉ đúng vào
      T1/T2/T3 và khớp với software ID khi nhìn vào thùng — chưa thực hiện được.
    procedure: evidence/A/W02/bench-procedure-w02.md (mục B4)

