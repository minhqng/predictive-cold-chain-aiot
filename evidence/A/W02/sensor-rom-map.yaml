# ColdGuard — Member A — W02
# DS18B20 ROM → role map (identity contract, docs/01 §6.4–6.5)
#
# Thẩm quyền: docs/01 §6.4 (sensor roles), §6.5 (identity contract),
#             §6.6 (PHY-DS-001..003), docs/05A §11 (A-W02-02, A-W02-03).
# Nguồn dữ liệu: evidence/A/W02/w02_rom_enumeration_4_devices.png (ảnh gốc,
#                người dùng cung cấp; xem screenshot-provenance.csv).
#
# CẢNH BÁO PHẠM VI CLAIM:
# - Tệp này chỉ khẳng định ROM đã được *quan sát và gán vai trò logic*.
# - Nó KHÔNG khẳng định đầu dò vật lý nào đã được dán nhãn, KHÔNG khẳng định
#   vị trí lắp thật đã freeze, và KHÔNG thay thế H0 mechanical (A-W02-01).
# - ROM được ghi NGUYÊN VĂN đúng chuỗi sketch in ra. Coi ROM là định danh
#   bất trong suốt (opaque); không tự suy diễn thứ tự byte/CRC từ chuỗi này.

schema: coldguard.sensor-rom-map/v0
week: W02
owner: member-a
hardware_config_id: NOT_ASSIGNED        # chưa được leader gán (kế thừa W01)
firmware_commit: NOT_RECORDED            # sketch bench W02 không nằm trong repo
