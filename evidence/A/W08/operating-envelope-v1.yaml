off_current_envelope:
  steady_max_observed_a: 0.02
  steady_frames: 355
  steady_nonzero_frames: 10
  steady_floor_a: 0.05
  latency_frames_excluded: 2
  latency_excluded_peak_a: 7.15
  bench_gate_limit_a: 0.2
  provenance: H8 frame field off_current_limit_a=0.200 (raw telemetry, bench image), not a canonical limit and not a production value
  rule: see off_register_latency_rule below; the excluded frames are listed
        individually in holdover-frames.csv and duty-zero-current-frames.csv
  status: REAL_DATA_ANALYZED

off_register_latency_rule:
  pre_run_register: first frame of a driven block with 0.00 A while the applied duty is nonzero
  outputs_off_register: duty-0 frame within 1500 ms of the last driven frame with current above the steady floor: the first post-OFF poll returns the last loaded registers (byte-identical in the committed 600 s capture)
  off_settling: duty-0 frame within 3000 ms of the last driven frame with current above the steady floor
  off_residual_above_floor: duty-0 frame above the steady floor outside 3000 ms: named, excluded, never averaged
  suspect_zero_current: driven frame with 0.00 A that is not first in its block - reported, never dropped
  hold_window_ms: 1500
  settle_window_ms: 3000
  steady_floor_a: 0.05
  frames_named_not_averaged: 31

