# ColdGuard development broker baseline, Member C W02 (C-W02-01).
#
# Authenticated profile for local development:
#   - explicit plaintext listener on 1883 (Compose binds it to
#     127.0.0.1 only; see infra/compose.yaml, so the broker is never
#     exposed broadly from a workstation);
#   - anonymous clients are denied; every client must present a
#     username/password from the provisioned password file;
#   - topic permissions come from acl.conf (device-scoped, no
#     `coldguard/#` wildcard grant for devices, no backend publish
#     spoof path).
#
# The password file itself is NOT tracked: generate it on each checkout
# with infra/mosquitto/provision-dev.sh (documented in the root README).
# Only placeholder credential *names* are committed, never secrets.
#
# TLS-ready, NOT TLS-deployed (W02): the commented listener below reserves
# the structure so a future 8883 TLS listener can be added without
# restructuring this file. No dummy CA/certificates are shipped.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
log_type error
log_type warning
log_type notice
log_type information

# --- TLS-ready reservation (not active in W02) ---
# To deploy TLS later: place real CA/server material under
# /mosquitto/config/tls/ (never commit keys), then uncomment:
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/tls/ca.crt
# certfile /mosquitto/config/tls/server.crt
# keyfile /mosquitto/config/tls/server.key
# require_certificate false
