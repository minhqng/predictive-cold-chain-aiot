# ColdGuard broker ACL v0, Member C W02 (C-W02-01).
#
# Semantics per the Eclipse Mosquitto 2.x `mosquitto.conf` manual
# (acl_file): with an ACL file defined, only listed topics are
# accessible. Each `user` block below grants exactly the topics that
# principal needs; anything unlisted is denied.
#
# Principal model (Doc 02 section 12, Doc 05C section 8):
#   device-coldguard-001 ... the single P0 synthetic/real device
#     identity. Publishes its own telemetry/event/state/command_ack/
#     health, subscribes its own command. It MUST NOT publish commands
#     (no `.../command` write line) and MUST NOT touch other devices or
#     `coldguard/#` broadly.
#   backend-ingest ......... backend MQTT consumer (C-W02-03).
#     Subscribe-only on device-data topics. No publish lines at all, so
#     the backend ingestion identity cannot spoof device telemetry or
#     publish commands in this slice (command publish belongs to W06
#     under a separate principal).
#
# Anonymous clients: no lines apply to them and `allow_anonymous false`
# is set in mosquitto.conf, so unauthenticated access is denied at
# CONNECT (reason code 0x05 Not Authorized), which is distinguishable
# from a TCP connectivity failure.

user device-coldguard-001
topic write coldguard/coldguard-001/telemetry
topic write coldguard/coldguard-001/event
topic write coldguard/coldguard-001/state
topic write coldguard/coldguard-001/command_ack
topic write coldguard/coldguard-001/health
topic read coldguard/coldguard-001/command

user backend-ingest
topic read coldguard/+/telemetry
topic read coldguard/+/event
topic read coldguard/+/state
topic read coldguard/+/command_ack
topic read coldguard/+/health

# Authorized command dispatch principal (C-W06-03). Separate from the
# subscribe-only backend-ingest identity: it may write only the single
# configured device's command topic, nothing else.
user backend-command
topic write coldguard/coldguard-001/command
