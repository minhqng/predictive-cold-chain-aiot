[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coldguard-backend"
version = "0.1.0"
description = "ColdGuard IoT backend skeleton (Member C)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
gateway = ["pyserial==3.5"]
inference = ["xgboost-cpu>=3.1,<4"]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# GHSA-6q48-6c7w-9gw2 and CVE-2026-114603: constrain transitive
# trust/trace dependencies without adding new runtime integrations.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
