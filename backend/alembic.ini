# ColdGuard backend Alembic configuration (C-W01-04).
# The connection URL is resolved in migrations/env.py from explicit
# validated configuration (DATABASE_URL env var wins, otherwise the
# ColdGuardConfig-derived URL). The sqlalchemy.url here is only a
# placeholder so the file stays committable without secrets.
[alembic]
script_location = src/coldguard_backend/migrations

sqlalchemy.url = postgresql+psycopg://coldguard:coldguard_dev_only@localhost:5432/coldguard
